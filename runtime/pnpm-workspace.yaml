packages:
  - "shared/*"
  - "notebook/*"
  - "!notebook/*/auplc_jupyterlab_runtime_status/labextension"
  - "code-server/extensions/*"
  - "hub/frontend/packages/*"
  - "hub/frontend/apps/*"

catalog:
