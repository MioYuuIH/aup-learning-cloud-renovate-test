  typescript: ^7.0.2
  "@types/node": ^25.2.3
  "@types/react": ^19.2.13
  "@types/react-dom": ^19.2.3

  # React
  react: ^19.2.4
  react-dom: ^19.2.4

  # Testing
  vitest: ^4.1.11
  jsdom: ^30.0.1
  "@testing-library/react": ^16.3.0
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/user-event": ^14.6.1

  # Build tools
  vite: ^8.2.2
  "@vitejs/plugin-react": ^6.1.0

  # Charts & Dashboard
  recharts: ^3.10.1
  tailwindcss: ^4.1.0
  "@tailwindcss/vite": ^4.1.0
  "@tailwindcss/cli": ^4.1.0
