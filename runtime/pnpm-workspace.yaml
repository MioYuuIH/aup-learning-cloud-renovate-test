  eslint: ^10.9.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.33.1
  globals: ^17.11.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.4.20

