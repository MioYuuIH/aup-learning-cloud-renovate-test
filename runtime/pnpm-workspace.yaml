  jsdom: ^26.1.0
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/user-event": ^14.6.7

  # Build tools
  vite: ^7.3.6
  "@vitejs/plugin-react": ^5.2.0

  # Charts & Dashboard
  recharts: ^2.15.4
  tailwindcss: ^4.3.3
